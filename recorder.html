<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recording Active</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      margin: 0;
      background: #202124;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
    }
    .indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #ea4335;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #ea4335;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    #timer {
      font-size: 34px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      margin-bottom: 20px;
    }
    button {
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    #stopBtn {
      background: #ea4335;
      color: white;
      transition: background 0.2s;
    }
    #stopBtn:hover { background: #d93025; }
    #stopBtn:disabled { background: #5f6368; cursor: not-allowed; }
    #closeBtn {
      background: #1a73e8;
      color: white;
      margin-top: 14px;
      display: none;
    }
    #statusMessage {
      font-size: 13px;
      color: #9aa0a6;
      margin-top: 12px;
      line-height: 1.4;
      max-width: 260px;
    }
  </style>
</head>
<body>
  <div id="indicator" class="indicator">
    <span class="dot"></span> RECORDING
  </div>
  <div id="timer">00:00</div>
  <button id="stopBtn">Stop & Save</button>
  <div id="statusMessage"></div>
  <button id="closeBtn">Close Window</button>

  <script src="db.js"></script>
  <script src="fix-webm-duration.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
