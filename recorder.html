<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meet Recording Studio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 16px;
      margin: 0;
      background: #1e1e24;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #9aa0a6;
    }
    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ea4335;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #ea4335;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .mode-badge {
      background: #3c4043;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .yt-badge {
      display: none;
      background: #cc0000;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    #timer {
      font-size: 38px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      margin: 10px 0;
    }
    .meters-container {
      width: 100%;
      background: #2b2b36;
      padding: 12px;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .meter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: #bdc1c6;
      margin-bottom: 8px;
    }
    .meter-row:last-child { margin-bottom: 0; }
    .meter-label {
      width: 52px;
      text-align: left;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.3px;
    }
    canvas {
      flex: 1;
      height: 8px;
      background: #111;
      border-radius: 4px;
    }
    .mute-btn {
      flex: none;
      width: 52px;
      padding: 4px 0;
      background: #3c4043;
      color: #bdc1c6;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #4a4d52;
      text-align: center;
      transition: all 0.2s;
    }
    .mute-btn:hover {
      background: #4f5357;
      color: #fff;
    }
    .mute-btn.muted {
      background: #ea4335;
      color: #ffffff;
      border-color: #d93025;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    button {
      flex: 1;
      border: none;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    #pauseBtn {
      background: #3c4043;
      color: #fff;
    }
    #pauseBtn:hover { background: #4f5357; }
    #stopBtn {
      background: #ea4335;
      color: white;
    }
    #stopBtn:hover { background: #d93025; }
    #closeBtn {
      background: #1a73e8;
      color: white;
      display: none;
      width: 100%;
    }
    #statusMessage {
      font-size: 12px;
      color: #9aa0a6;
      min-height: 16px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-group">
      <div id="indicator" class="indicator">
        <span class="dot"></span> <span id="statusBadge">LIVE</span>
      </div>
      <span id="modeBadge" class="mode-badge">LOCAL</span>
      <span id="ytBadge" class="yt-badge">YT LIVE</span>
    </div>
    <div id="meetingTag">Meet</div>
  </div>

  <div id="timer">00:00</div>

  <div class="meters-container">
    <div class="meter-row">
      <span class="meter-label">MIC (DSP)</span>
      <canvas id="micMeter" width="160" height="8"></canvas>
      <button id="muteMicBtn" class="mute-btn" title="Toggle Microphone Mute">Mute</button>
    </div>
    <div class="meter-row">
      <span class="meter-label">TAB</span>
      <canvas id="tabMeter" width="160" height="8"></canvas>
      <button id="muteTabBtn" class="mute-btn" title="Toggle Tab Audio Mute">Mute</button>
    </div>
  </div>

  <div class="actions">
    <button id="pauseBtn">Pause</button>
    <button id="stopBtn">Stop</button>
  </div>
  <button id="closeBtn">Close Window</button>

  <div id="statusMessage"></div>

  <script src="db.js"></script>
  <script src="fix-webm-duration.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
