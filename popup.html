<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      box-sizing: border-box;
      background: #ffffff;
      color: #202124;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5f6368;
      margin-bottom: 4px;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      background: #fff;
    }
    .collapsible {
      display: none;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid #e8eaed;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    #startBtn {
      background: #1a73e8;
      color: white;
    }
    #startBtn:disabled {
      background: #dadce0;
      cursor: not-allowed;
    }
    #recoverBtn {
      background: #f9ab00;
      color: #202124;
      margin-top: 8px;
      display: none;
    }
    #statusText {
      margin-top: 10px;
      font-size: 12px;
      color: #5f6368;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h3>Meet Recorder Pro</h3>
  
  <div class="field">
    <label for="sourceSelect">Capture Source</label>
    <select id="sourceSelect">
      <option value="tab">Active Tab (Google Meet - Direct)</option>
      <option value="screen">Entire Screen / Window / App</option>
    </select>
  </div>

  <div class="field">
    <label for="micSelect">Microphone</label>
    <select id="micSelect"></select>
  </div>

  <div class="field">
    <label for="codecSelect">Encoding Profile</label>
    <select id="codecSelect">
      <option value="h264|3000000">H.264 (Recommended for Live & Edits)</option>
      <option value="vp8|2500000">VP8 (Balanced)</option>
      <option value="vp9|3500000">VP9 (Crisp Slides & Text)</option>
    </select>
  </div>

  <div class="field">
    <label for="destMode">Output Destination</label>
    <select id="destMode">
      <option value="local">Save to Local Drive Only</option>
      <option value="both">Both (Local Drive + YouTube Live)</option>
      <option value="yt">YouTube Live Only</option>
    </select>
  </div>

  <div id="ytSettings" class="collapsible">
    <div class="field">
      <label for="relayUrl">Relay Server WebSocket URL</label>
      <input type="text" id="relayUrl" placeholder="wss://elroi-live.onrender.com/live">
    </div>
    <div class="field" style="margin-bottom: 0;">
      <label for="streamKey">YouTube Stream Key</label>
      <input type="password" id="streamKey" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx">
    </div>
  </div>

  <button id="startBtn">Start Recording</button>
  <button id="recoverBtn">Recover Unsaved Recording</button>

  <div id="statusText">Ready</div>

  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
